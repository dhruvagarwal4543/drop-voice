name: dropvoice
description: "DROPVOICE — Gaming voice chat for BGMI and beyond."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.3.6

  # Google Sign-In
  google_sign_in: ^6.2.2

  # LiveKit
  livekit_client: ^2.4.3

  # Navigation
  go_router: ^14.6.3

  # HTTP (token server calls)
  http: ^1.2.2

  # Permissions
  permission_handler: ^11.3.1

  # Environment config
  flutter_dotenv: ^5.2.1
  google_fonts: ^8.2.1

  # Image picking (avatars / chat images)
  image_picker: ^1.1.2

  # Sharing + clipboard
  share_plus: ^10.1.2

  cupertino_icons: ^1.0.8
  flutter_background: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
